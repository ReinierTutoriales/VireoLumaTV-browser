name: Baseline profile

# Generated once per version: by hand, or in the release preparation PR (branch `preparacion/*`).
# Profiles are uploaded as artifacts for owner review and signed inclusion in a release PR.
# Automation never impersonates the repository owner or pushes unsigned commits.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/res/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle.kts'
      - 'baselineprofile/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/baseline-profile.yml'

permissions:
  contents: read

concurrency:
  group: baseline-profile-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  generate:
    if: >-
      github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'preparacion/')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/adblock-jni

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # Hardware acceleration for the managed emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate baseline profile
        run: >
          ./gradlew :app:generateBaselineProfile --stacktrace
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload generator reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-profile-reports
          path: |
            baselineprofile/build/reports/androidTests/
            baselineprofile/build/outputs/androidTest-results/
            baselineprofile/build/intermediates/managed_device_android_test_additional_output/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-profile
          path: app/src/main/generated/baselineProfiles/
          if-no-files-found: error

