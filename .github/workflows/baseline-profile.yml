name: Baseline profile

# Run by hand after changes to start-up or remote handling. Generates the profile on an emulator
# (Gradle managed device) and proposes it as a pull request; the reviewer merges it like any change.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: baseline-profile
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native/adblock-jni

      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic

      # Hardware acceleration for the managed emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate baseline profile
        run: >
          ./gradlew :app:generateBaselineProfile --stacktrace
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload profile
        uses: actions/upload-artifact@v7.0.2
        with:
          name: baseline-profile
          path: app/src/main/generated/baselineProfiles/
          if-no-files-found: error

      - name: Propose the profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add app/src/main/generated/baselineProfiles/
          if git diff --cached --quiet; then echo 'Profile unchanged'; exit 0; fi
          branch="baseline-profile/${GITHUB_RUN_ID}"
          git config user.name 'ReinierTutoriales'
          git config user.email '86568548+ReinierTutoriales@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m 'Actualiza el perfil de referencia'
          git push origin "$branch"
          gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
            --title 'Actualiza el perfil de referencia' \
            --body "Generado por el workflow Baseline profile (run ${GITHUB_RUN_ID}) en un emulador Pixel 6, API 34." \
            || echo 'Pull request not created: the profile is in the artifact and on branch '"$branch"
