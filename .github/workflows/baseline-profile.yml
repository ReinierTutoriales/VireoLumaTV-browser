name: Baseline profile

# Generate after app/journey changes in same-repository PRs, or manually.
# Generated commits do not recursively regenerate profiles; CI and Benchmark verify their SHA.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/res/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle.kts'
      - 'baselineprofile/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/baseline-profile.yml'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  # The bot's own profile push starts a run that the job skips; give it a group of its own so it
  # never cancels the generator that pushed it while that one approves the new checks.
  group: baseline-profile-${{ github.head_ref || github.ref_name }}${{ github.actor == 'github-actions[bot]' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROFILE_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native/adblock-jni

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic

      # Hardware acceleration for the managed emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate baseline profile
        run: >
          ./gradlew :app:generateBaselineProfile --stacktrace
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload generator reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: baseline-profile-reports
          path: |
            baselineprofile/build/reports/androidTests/
            baselineprofile/build/outputs/androidTest-results/
            baselineprofile/build/intermediates/managed_device_android_test_additional_output/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload profile
        uses: actions/upload-artifact@v7.0.2
        with:
          name: baseline-profile
          path: app/src/main/generated/baselineProfiles/
          if-no-files-found: error

      - name: Propose the profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add app/src/main/generated/baselineProfiles/
          if git diff --cached --quiet; then echo 'Profile unchanged'; exit 0; fi
          git config user.name 'ReinierTutoriales'
          git config user.email '86568548+ReinierTutoriales@users.noreply.github.com'
          # The runs this push starts on the pull request wait for approval ("action_required") and
          # leave its checks pending. Approve them so CI and Benchmark run on the new SHA; when none
          # appear or approval is refused, dispatch both workflows instead.
          verify() {
            local ref=$1 sha ids='' approved=0
            sha=$(git rev-parse HEAD)
            for attempt in $(seq 1 12); do
              ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&status=action_required" --jq '.workflow_runs[].id')
              [ -n "$ids" ] && break
              sleep 10
            done
            for id in $ids; do
              if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" >/dev/null; then approved=1; fi
            done
            if [ "$approved" = 0 ]; then
              gh workflow run ci.yml --ref "$ref"
              gh workflow run benchmark.yml --ref "$ref"
            fi
          }
          # On a working branch the profile joins that branch's pull request instead of a new one.
          if [ "${PROFILE_BRANCH}" != master ]; then
            git commit -m 'Actualiza el perfil de referencia'
            git push origin "HEAD:${PROFILE_BRANCH}"
            verify "${PROFILE_BRANCH}"
            exit 0
          fi
          branch="baseline-profile/${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m 'Actualiza el perfil de referencia'
          git push origin "$branch"
          gh pr create --base "${PROFILE_BRANCH}" --head "$branch" \
            --title 'Actualiza el perfil de referencia' \
            --body "Generado por el workflow Baseline profile (run ${GITHUB_RUN_ID}) en un emulador Pixel 6, API 34." \
            || echo 'Pull request not created: the profile is in the artifact and on branch '"$branch"
          verify "$branch"
