name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # Rust adblock engine (native/adblock-jni); Gradle runs cargo with the NDK linkers.
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native/adblock-jni

      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          # open-source (MIT) cache provider; v6 defaults to the commercial "enhanced" one
          cache-provider: basic

      # Same debug signing key on every run, so debug APKs install over each other (adb install -r)
      # without losing data. Skipped when the secret is unavailable (e.g. pull requests from forks).
      - name: Restore shared debug keystore
        if: env.HAS_DEBUG_KEYSTORE == 'true'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep "SHA256:"


      - name: Verify release signing configuration
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          test -n "$RELEASE_SIGNING_KEY" || { echo 'RELEASE_SIGNING_KEY is missing'; exit 1; }
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$work/private.pem"
          python - "$work/public.pem" <<'PY'
          import re, sys
          from pathlib import Path
          source = Path('app/src/main/java/com/reiniertutoriales/vireolumatv/utils/ReleaseUpdater.kt').read_text()
          match = re.search(r'RELEASE_PUBLIC_KEY_PEM = """(-----BEGIN PUBLIC KEY-----.*?-----END PUBLIC KEY-----)"""', source, re.S)
          if match is None:
              raise SystemExit('Pinned public key is missing')
          Path(sys.argv[1]).write_text(match.group(1) + '\n')
          PY
          printf 'release signing verification\n' > "$work/message"
          openssl dgst -sha256 -sign "$work/private.pem" -out "$work/signature" "$work/message"
          openssl dgst -sha256 -verify "$work/public.pem" -signature "$work/signature" "$work/message"
          printf 'altered checksums\n' > "$work/altered"
          if openssl dgst -sha256 -verify "$work/public.pem" -signature "$work/signature" "$work/altered" >/dev/null 2>&1; then
            echo 'Altered content was incorrectly accepted'
            exit 1
          fi

      - name: Unit tests
        run: |
          python scripts/check-source-inventory.py
          node scripts/test-home-page-security.cjs
          python scripts/test-apk-provenance.py
          node scripts/test-blob-transfer.cjs
          node scripts/test-webview-controls.cjs
          node scripts/test-youtube-adblock.cjs
          node scripts/test-media-policy.cjs
          node scripts/test-window-open-decoy.cjs
          node scripts/test-adblock-surrogates.cjs
          node scripts/test-page-filters.cjs
          ./gradlew testGenericDebugUnitTest --stacktrace

      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-ui-previews
          path: app/build/reports/ui/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Build debug APK
        run: ./gradlew assembleGenericDebug --stacktrace

      - name: Verify tracked Room v19 schema
        run: |
          schema='app/schemas/com.reiniertutoriales.vireolumatv.singleton.AppDatabase/19.json'
          test -s "$schema"
          git ls-files --error-unmatch "$schema"
          git diff --exit-code -- app/schemas/

      - name: Upload generated Room schemas
        uses: actions/upload-artifact@v7.0.2
        with:
          name: room-schemas
          path: app/schemas/**/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Validate release build
        env:
          CI_SIGN_RELEASE_WITH_DEBUG_KEY: ${{ env.HAS_DEBUG_KEYSTORE }}
        run: ./gradlew assembleGenericRelease lintGenericRelease --stacktrace

      - name: Audit debug and minified APK contents
        run: |
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          test -n "$aapt2"
          for apk in app/build/outputs/apk/generic/debug/*.apk app/build/outputs/apk/generic/release/*.apk; do
            python scripts/audit-apk-provenance.py "$apk" --aapt2 "$aapt2" --output "app/build/reports/provenance/$(basename "$apk").json"
          done

      - name: Upload APK provenance reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: apk-provenance-reports
          path: app/build/reports/provenance/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vireolumatv-debug
          path: app/build/outputs/apk/generic/debug/*.apk
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vireolumatv-release
          path: app/build/outputs/apk/generic/release/*.apk
          retention-days: 7
