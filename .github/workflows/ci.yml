name: CI

on:
  push:
    branches:
      - master
      - 'fixes/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # open-source (MIT) cache provider; v6 defaults to the commercial "enhanced" one
          cache-provider: basic

      # Same debug signing key on every run, so debug APKs install over each other (adb install -r)
      # without losing data. Skipped when the secret is unavailable (e.g. pull requests from forks).
      - name: Restore shared debug keystore
        if: env.HAS_DEBUG_KEYSTORE == 'true'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep "SHA256:"

      - name: Unit tests
        run: ./gradlew testGenericDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleGenericDebug --stacktrace

      - name: Validate release build
        run: ./gradlew assembleGenericRelease --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: tvbro-debug
          path: app/build/outputs/apk/generic/debug/*.apk
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: tvbro-release
          path: app/build/outputs/apk/generic/release/*.apk
          retention-days: 7
