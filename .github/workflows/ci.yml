name: CI

on:
  push:
    branches:
      - master
      - 'fixes/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # open-source (MIT) cache provider; v6 defaults to the commercial "enhanced" one
          cache-provider: basic

      - name: Unit tests
        run: ./gradlew testGenericGeckoExcludedDebugUnitTest --stacktrace

      - name: Build debug APK (GeckoExcluded)
        run: ./gradlew assembleGenericGeckoExcludedDebug --stacktrace

      - name: Build debug APK (GeckoIncluded)
        run: ./gradlew assembleGenericGeckoIncludedDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK (GeckoExcluded)
        uses: actions/upload-artifact@v6
        with:
          name: tvbro-debug-geckoExcluded
          path: app/build/outputs/apk/genericGeckoExcluded/debug/*.apk
          retention-days: 7

      - name: Upload debug APK (GeckoIncluded)
        uses: actions/upload-artifact@v6
        with:
          name: tvbro-debug-geckoIncluded
          path: app/build/outputs/apk/genericGeckoIncluded/debug/*.apk
          retention-days: 7
