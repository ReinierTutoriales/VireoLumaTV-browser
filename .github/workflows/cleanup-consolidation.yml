name: Clean verified integrated branches

on:
  push:
    branches: [fixes/consolidated-audit-20261007]
    paths: ['.github/workflows/cleanup-consolidation.yml']

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: verified-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'ReinierTutoriales/VireoLumaTV-browser'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify CI and delete only identical integrated trees with a ref lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='ReinierTutoriales/VireoLumaTV-browser'
          base='521c214a9931419deca1309964027fe914ae0d5a'
          test "$(gh api "repos/$repo/git/ref/heads/fixes/audit" --jq '.object.sha')" = "$base"
          test "$(gh api "repos/$repo/actions/runs/37604054177" --jq '.conclusion')" = success
          test "$(gh api "repos/$repo/actions/runs/37604054177" --jq '.head_sha')" = '20cc6bfb01e9cc40e57fd16df5747788a6c80bbb'
          open_refs=$(gh api --paginate "repos/$repo/pulls?state=open&per_page=100" --jq '.[] | .head.ref, .base.ref')
          while read -r branch expected integrated; do
            if printf '%s\n' "$open_refs" | grep -Fxq "$branch"; then
              echo "Retained open-PR branch: $branch"
              continue
            fi
            if ! actual=$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha'); then
              echo "Retained or already absent: $branch"
              continue
            fi
            protected=$(gh api "repos/$repo/branches/$branch" --jq '.protected')
            test "$protected" = false
            if test "$actual" != "$expected"; then
              echo "Retained changed branch: $branch"
              continue
            fi
            git merge-base --is-ancestor "$integrated" "$base"
            test "$(git rev-parse "$expected^{tree}")" = "$(git rev-parse "$integrated^{tree}")"
            test "$(gh api "repos/$repo/git/ref/heads/fixes/audit" --jq '.object.sha')" = "$base"
            git push --force-with-lease="refs/heads/$branch:$expected" origin ":refs/heads/$branch"
            echo "Deleted verified branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          done <<'BRANCHES'
          fixes/credits-20261006 8500397bf26795111f0a00453b02f13ff7be6a14 29047977a28ca51404a229fa7910902b9f63c7e9
          fixes/engine-adblock-audit-20261006 71b6cdc6b851f8b09fe31cc25ebc47085ddd170c dfa75b7eb9d1c575e9089d1cb595e05d4568c5bb
          fixes/home-search-preview-20261006 9a438b64c5831bee3d0d0a7ef2d4e8ca411ee8b4 90deabd3cce9e728791c8bb43cfa6317e0adec8e
          fixes/input-adblock-recovery-20261005 e00b1a683853574fc136060e33300336bcf35d4d 20239306c76e6277b76960393b22a531f2eab257
          fixes/minimal-home-20261006 e2ea73b5ee94ee44b6ad096c090b65ca9050a7ad 58598d888fcff6c11bc921c8c4c977a737618aa6
          fixes/tv-menu-focus-20261006 292e8fe801cccfc2161e11978285e19ebd1e6fc8 49e91288383adcc9cab477066aa2f5b23aeafe91
          fixes/tv-navigation-20261005 28c723d3671e1665a5e597c9dc5881e4dcfe5bb2 1928ffa139075ba66a4bfccd3acb95cdfb0cd8f1
          fixes/tv-tab-focus-20261006 cd00b1af53f6d645f41adce5f3826c9507f4c7de 521c214a9931419deca1309964027fe914ae0d5a
          BRANCHES
