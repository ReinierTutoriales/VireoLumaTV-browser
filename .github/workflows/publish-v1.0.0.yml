name: Publish v1.0.0

on:
  push:
    branches: [fixes/audit]
    paths: ['.github/workflows/publish-v1.0.0.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_RELEASE_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_SHARED_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6
      - name: Refuse to replace an existing release or tag
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" >/dev/null 2>&1; then
            echo 'v1.0.0 already exists; refusing to replace it.'
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            echo 'v1.0.0 tag already exists; refusing to move it.'
            exit 1
          fi
          python - <<'PYCODE'
          from pathlib import Path
          source = Path('app/build.gradle.kts').read_text()
          assert 'versionName = "1.0.0"' in source
          assert 'versionCode = 70' in source
          PYCODE
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Restore signing key
        env:
          RELEASE_KEY: ${{ secrets.KEYSTORE_BASE64 }}
          SHARED_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ "$HAS_RELEASE_KEY" = true ]; then
            printf '%s' "$RELEASE_KEY" | base64 --decode > "$RUNNER_TEMP/release.jks"
          elif [ "$HAS_SHARED_KEY" = true ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$SHARED_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            echo 'No configured signing key; refusing to publish an unsigned or randomly signed APK.'
            exit 1
          fi
      - name: Verify complete test suite and debug build
        run: |
          node scripts/test-home-page-security.cjs
          node scripts/test-webview-controls.cjs
          ./gradlew testGenericDebugUnitTest assembleGenericDebug --stacktrace
      - name: Build with release certificate
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleGenericRelease --stacktrace
      - name: Build with existing shared CI certificate
        if: env.HAS_RELEASE_KEY != 'true' && env.HAS_SHARED_KEY == 'true'
        env:
          CI_SIGN_RELEASE_WITH_DEBUG_KEY: 'true'
        run: ./gradlew assembleGenericRelease --stacktrace
      - name: Verify APK version and signature; prepare release files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/generic/release/app-generic-release.apk dist/VireoLumaTV-1.0.0.apk
          python - <<'PYCODE'
          import json
          from pathlib import Path
          metadata = json.loads(Path('app/build/outputs/apk/generic/release/output-metadata.json').read_text())
          assert len(metadata['elements']) == 1
          element = metadata['elements'][0]
          assert element['versionName'] == '1.0.0'
          assert element['versionCode'] == 70
          PYCODE
          build_tools=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose --print-certs dist/VireoLumaTV-1.0.0.apk > dist/SIGNING.txt
          if [ "$HAS_RELEASE_KEY" != true ]; then
            printf '\nFirma: certificado compartido de CI existente (debug); APK release optimizado con R8.\n' >> dist/SIGNING.txt
            printf '\n**Firma:** esta entrega utiliza el certificado compartido de CI existente, de tipo debug; el APK es la compilación release optimizada con R8.\n' >> RELEASE_NOTES.md
          fi
          printf 'Application source: https://github.com/%s/tree/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > dist/RELEASE_SOURCE.txt
          cp LICENSE.md NOTICE.md dist/
          cp licenses/*.txt dist/
          cp app/src/main/assets/licenses/SOURCES.txt dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Publish v1.0.0
        run: |
          gh release create v1.0.0 dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'VireoLumaTV 1.0.0' --notes-file RELEASE_NOTES.md --latest
      - name: Remove temporary production key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
