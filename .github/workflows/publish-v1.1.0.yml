name: Publish v1.1.0

on:
  push:
    branches: [fixes/audit]
    paths: ['.github/workflows/publish-v1.1.0.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v1.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_SHARED_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
      # Certificate of v1.0.0: updates must be signed with it to install over the existing app.
      EXPECTED_CERT_SHA256: 325056725415ab511afeb5d554e75f3de6cdc89aab906432c770b8fdcf6d149f
    steps:
      - uses: actions/checkout@v6
      - name: Refuse to replace an existing release or tag
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.0" >/dev/null 2>&1; then
            echo 'v1.1.0 already exists; refusing to replace it.'
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.1.0 >/dev/null 2>&1; then
            echo 'v1.1.0 tag already exists; refusing to move it.'
            exit 1
          fi
          grep -q 'versionName = "1.1.0"' app/build.gradle.kts
          grep -q 'versionCode = 88' app/build.gradle.kts
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/adblock-jni
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Restore signing key
        env:
          SHARED_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ "$HAS_SHARED_KEY" != true ]; then
            echo 'The certificate of v1.0.0 is not configured; refusing to publish an APK that cannot update it.'
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$SHARED_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
      - name: Verify complete test suite and debug build
        run: |
          for test in scripts/test-*.cjs; do node "$test"; done
          ./gradlew testGenericDebugUnitTest assembleGenericDebug --stacktrace
      - name: Build release with the v1.0.0 certificate
        env:
          CI_SIGN_RELEASE_WITH_DEBUG_KEY: 'true'
        run: ./gradlew assembleGenericRelease --stacktrace
      - name: Verify APK version and signature; prepare release files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/generic/release/app-generic-release.apk dist/VireoLumaTV-1.1.0.apk
          python - <<'PYCODE'
          import json
          from pathlib import Path
          metadata = json.loads(Path('app/build/outputs/apk/generic/release/output-metadata.json').read_text())
          assert len(metadata['elements']) == 1
          element = metadata['elements'][0]
          assert element['versionName'] == '1.1.0'
          assert element['versionCode'] == 88
          PYCODE
          build_tools=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose --print-certs dist/VireoLumaTV-1.1.0.apk > dist/SIGNING.txt
          grep -q "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" dist/SIGNING.txt
          printf '\nFirma: certificado compartido de CI existente (debug), el mismo de la 1.0.0; APK release optimizado con R8.\n' >> dist/SIGNING.txt
          printf 'Application source: https://github.com/%s/tree/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > dist/RELEASE_SOURCE.txt
          cp LICENSE.md NOTICE.md dist/
          cp licenses/*.txt dist/
          cp app/src/main/assets/licenses/SOURCES.txt dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Publish v1.1.0
        run: |
          gh release create v1.1.0 dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'VireoLumaTV 1.1.0' --notes-file RELEASE_NOTES.md --latest
      - name: Remove signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
