name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.3)'
        required: true
      prerelease:
        description: 'Release type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build release APK
        run: ./gradlew assembleGenericRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename artifacts
        run: |
          for dir in generic; do
            for f in app/build/outputs/apk/${dir}/release/app-*.apk; do
              new="${f/app-/vireo-${{ inputs.version }}-}"
              mv "$f" "${new/-release.apk/.apk}"
            done
          done

      - name: Record corresponding application source
        shell: bash
        run: |
          printf 'Application source: https://github.com/%s/tree/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > RELEASE_SOURCE.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ inputs.prerelease == 'pre-release' }}
          files: |
            app/build/outputs/apk/generic/release/*.apk
            LICENSE.md
            NOTICE.md
            licenses/*.txt
            app/src/main/assets/licenses/SOURCES.txt
            RELEASE_SOURCE.txt