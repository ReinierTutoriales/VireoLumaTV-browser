name: Published startup diagnosis
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download published APKs
        run: |
          mkdir -p startup-report
          for version in 2.0.14 2.0.15; do
            curl --fail --location --retry 3 "https://github.com/ReinierTutoriales/VireoLumaTV-browser/releases/download/v$version/VireoLumaTV-$version-x86_64.apk" -o "$version.apk"
          done
          echo '8054de712a9bace15adb5bc496e09c807dac2d7342f8ec120da49976470d7b08  2.0.14.apk' | sha256sum -c
          echo '3ea7c782a163605d42863f278e8529dcb7469a5d73209e1b2461d71baa10e73a  2.0.15.apk' | sha256sum -c
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce fresh and upgrade startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          script: bash scripts/diagnose-published-startup.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: startup-api-${{ matrix.api }}
          path: startup-report/
          retention-days: 7
