name: Inspect captured startup failure
on:
  create:
  push:
    branches: [diagnose/startup-cold]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/diagnose/startup-cold'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-startup-api-34
          run-id: 41521793805
          github-token: ${{ github.token }}
          path: evidence
      - uses: actions/download-artifact@v8.0.2
        with:
          name: vireolumatv-release
          run-id: 41521793805
          github-token: ${{ github.token }}
          path: apks
      - name: Inspect startup initializers and provider traffic
        run: |
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          apk=$(find apks -name '*x86_64*.apk' -type f)
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -A 6 -B 2 -E 'EmojiCompat|InitializationProvider|ProfileInstaller'
          python - <<'PY'
          from pathlib import Path
          import re
          for f in Path('evidence').rglob('cold-logcat.txt'):
              lines = f.read_text(errors='replace').splitlines()
              print('\n'.join([line for line in lines if re.search(r'font|emoji|FontsProvider', line, re.I)][-120:]))
          PY
