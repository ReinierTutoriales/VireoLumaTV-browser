name: Finish consolidation to master
on:
  push:
    branches: [diagnose/focus-startup]
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Require preserved history and unchanged files, then delete branches
        run: |
          python - <<'PY'
          import json, os, subprocess, time
          others = json.loads("[{\"name\":\"diagnose/font-provider-client\",\"sha\":\"1d6f1d20d7431ffed7c23c0e9f2d8064292cde0b\"},{\"name\":\"diagnose/startup-cold\",\"sha\":\"500cf036f804cf1033f42983e168581321456df8\"}]")
          expected_tree = '35bde7ab16cf6a72f244919ada7a860c4e795c94'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          rows = [{'name':'diagnose/focus-startup','sha':os.environ['GITHUB_SHA']}] + others
          for attempt in range(24):
              subprocess.run(['git','fetch','origin','master'],check=True)
              merged = all(subprocess.run(['git','merge-base','--is-ancestor',row['sha'],'origin/master']).returncode == 0 for row in rows)
              if merged:
                  break
              time.sleep(5)
          assert merged, 'Diagnostic history must be preserved in master before deletion'
          assert git('rev-parse','origin/master^{tree}') == expected_tree, 'Master files changed unexpectedly'
          for row in rows:
              live = git('ls-remote','--heads','origin','refs/heads/' + row['name'])
              assert live.split()[0] == row['sha'], 'Branch changed after consolidation'
              print('History preserved in master:',row['name'],row['sha'],flush=True)
          args=['git','push','--atomic']
          args += [f"--force-with-lease=refs/heads/{row['name']}:{row['sha']}" for row in rows]
          args += ['origin','--delete']+[row['name'] for row in rows]
          subprocess.run(args,check=True)
          remaining=git('ls-remote','--heads','origin').splitlines()
          assert len(remaining)==1 and remaining[0].split()[1]=='refs/heads/master', remaining
          print('ONLY_MASTER_REMAINS',remaining[0],flush=True)
          
          PY
