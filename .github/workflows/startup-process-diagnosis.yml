name: Delete verified obsolete branches
on:
  push:
    branches: [diagnose/focus-startup]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify closed PRs and ancestry, then delete with leases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          rows = json.loads("[{\"name\":\"adblock-lazy-scriptlets\",\"sha\":\"76953ae87ad2508cc343e351c23ac7aa36cd1839\",\"merged\":true,\"closed_prs\":[172],\"eligible\":true},{\"name\":\"baseline-profile/41650883199\",\"sha\":\"7a00a9a1aa990c7364d0cf3f7550ae389b1e7eb2\",\"merged\":true,\"closed_prs\":[],\"eligible\":true},{\"name\":\"diagnose/startup-process\",\"sha\":\"8db47362bf3f3709cf4093df182a23e312bb3e5d\",\"merged\":false,\"closed_prs\":[180],\"eligible\":true},{\"name\":\"fix/unlimited-video\",\"sha\":\"6d3fe695b8093b8f868dda8f894858d24fc1bd38\",\"merged\":false,\"closed_prs\":[181],\"eligible\":true},{\"name\":\"improve/home-cards\",\"sha\":\"2bcff302e49f05856f0a31022894d22c211bdce3\",\"merged\":false,\"closed_prs\":[183],\"eligible\":true},{\"name\":\"improve/panel-transitions\",\"sha\":\"c1043347197520f71b93d2f5b0a0ad096986f1d7\",\"merged\":false,\"closed_prs\":[185],\"eligible\":true},{\"name\":\"improve/tv-focus-halo\",\"sha\":\"8346cb8d36dfa30283c279e05b0a2590aea8a207\",\"merged\":false,\"closed_prs\":[186],\"eligible\":true},{\"name\":\"improve/tv-focus-motion\",\"sha\":\"45b5cfaccc121890551b765fc458a41016e899e4\",\"merged\":false,\"closed_prs\":[184],\"eligible\":true},{\"name\":\"improve/video-viewport\",\"sha\":\"4da759e3faf28d5b34e91e3cb047223ff9ada16c\",\"merged\":false,\"closed_prs\":[187],\"eligible\":true}]")
          repo = 'ReinierTutoriales/VireoLumaTV-browser'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          for row in rows:
              name, sha = row['name'], row['sha']
              assert name not in ('master', 'main', 'diagnose/focus-startup')
              remote = git('ls-remote', '--heads', 'origin', 'refs/heads/' + name)
              assert remote.split()[0] == sha, f'Changed branch: {name}'
              if row['merged']:
                  subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'origin/master'], check=True)
              else:
                  assert row['closed_prs']
                  for number in row['closed_prs']:
                      result = subprocess.check_output(['gh', 'api', f'repos/{repo}/pulls/{number}'], text=True)
                      pr = json.loads(result)
                      assert pr['state'] == 'closed' and pr['head']['ref'] == name and pr['head']['sha'] == sha, name
              print('Verified:', name, sha, flush=True)
          args = ['git', 'push', '--atomic']
          args += [f"--force-with-lease=refs/heads/{row['name']}:{row['sha']}" for row in rows]
          args += ['origin', '--delete'] + [row['name'] for row in rows]
          subprocess.run(args, check=True)
          remaining = git('ls-remote', '--heads', 'origin')
          for row in rows:
              assert ('refs/heads/' + row['name']) not in [line.split()[1] for line in remaining.splitlines()]
          print('DELETED_VERIFIED_BRANCHES=' + str(len(rows)), flush=True)
          print(remaining)
          
          PY
