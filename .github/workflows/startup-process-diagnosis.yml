name: Inspect available Android SDK packages
on:
  push:
    branches: [diagnose/focus-startup]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List current SDK platforms and images
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version
          sdkmanager --list > packages.txt
          python - <<'PY'
          from pathlib import Path
          for line in Path('packages.txt').read_text().splitlines():
              if 'platforms;android-' in line or ('system-images;android-' in line and 'google_apis;x86_64' in line):
                  print(line)
          PY
