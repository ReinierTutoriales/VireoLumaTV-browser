<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; connect-src 'self'; img-src data: favicon:; form-action https://duckduckgo.com; base-uri 'none'; object-src 'none'">
    <link rel="icon" href="data:,">
    <meta name="vireo-strings" content="{{strings}}">
    <title>VireoLumaTV · {{title}}</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { display: flex; flex-direction: column; margin: 0; min-height: 100vh; justify-content: center; background: #000; background-image: radial-gradient(ellipse at 50% 0%, #11201a 0%, #000 70%); color: #e8ecf2; font-family: sans-serif; }
        main { width: 72%; max-width: 960px; margin: 0 auto; padding: 48px 0; }
        label { display: block; margin-bottom: 16px; font-size: 28px; font-weight: 600; text-align: center; }
        form { display: flex; gap: 12px; }
        input, button, a { border: 1px solid #333b49; border-radius: 24px; font: inherit; font-size: 24px; }
        input { min-width: 0; flex: 1; padding: 16px 24px; background: #1a2029; color: inherit; }
        button { padding: 12px 24px; background: #1a2029; color: inherit; cursor: pointer; }
        nav { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
        nav a, nav button { display: inline-flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; width: 120px; height: 96px; margin: 8px; padding: 8px; border-radius: 20px; background: linear-gradient(145deg, #263329, #161e1c); border-color: #405347; color: inherit; text-decoration: none; transition: transform 160ms ease-out, border-color 160ms ease-out; }
        nav img { width: 40px; height: 40px; object-fit: contain; }
        nav span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; }
        svg { width: 40px; height: 32px; }
        input:focus, button:focus, a:focus { outline: 3px solid #e8ecf2; outline-offset: 4px; }
        nav a:focus, nav button:focus { transform: scale(1.05); border-color: #e8ecf2; }
        @media (prefers-reduced-motion: reduce) { nav a, nav button { transition: none; } }
        input::placeholder { color: #a9b2c0; opacity: 1; }
        button:hover, a:hover { border-color: #e8ecf2; }
        nav.editing a { border-style: dashed; border-color: #7bd88f; }
        nav a.removed { opacity: 0.45; }
        nav #edit-bookmarks { padding: 8px; font-size: 20px; }
        @media (max-width: 600px) {
            main { width: 90%; padding: 24px 0; }
            input, button, a { font-size: 20px; }
            button { padding: 12px; }
        }
    </style>
</head>
<body>
<main>
    <form action="https://duckduckgo.com/" method="get" target="_self">
        <div style="flex: 1; min-width: 0;">
            <label for="search-input">DuckDuckGo</label>
            <div style="display: flex; gap: 12px;">
                <input id="search-input" name="q" type="search" placeholder="DuckDuckGo" aria-label="{{search}}" enterkeyhint="search" autocomplete="off" spellcheck="false" required>
                <button type="submit" aria-label="{{search}}"><svg viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true" focusable="false"><path d="M380-320q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l224 224q11 11 11 28t-11 28q-11 11-28 11t-28-11L532-372q-30 24-69 38t-83 14Zm0-80q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg></button>
            </div>
        </div>
    </form>
    <nav id="bookmarks" aria-label="{{shortcuts}}">
    <a id="default-youtube" href="https://m.youtube.com/" aria-label="YouTube">
        <svg viewBox="0 0 24 20" aria-hidden="true" focusable="false"><rect x="1" y="2" width="22" height="16" rx="5" fill="#f03"/><path d="M10 6 L16 10 L10 14 Z" fill="#fff"/></svg>
    </a>
    <button id="add-bookmark" type="button" aria-label="{{add}}"><svg viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true" focusable="false"><path d="M440-440H240q-17 0-28.5-11.5T200-480q0-17 11.5-28.5T240-520h200v-200q0-17 11.5-28.5T480-760q17 0 28.5 11.5T520-720v200h200q17 0 28.5 11.5T760-480q0 17-11.5 28.5T720-440H520v200q0 17-11.5 28.5T480-200q-17 0-28.5-11.5T440-240v-200Z"/></svg></button>
    <button id="edit-bookmarks" type="button" aria-label="{{editLabel}}" aria-pressed="false">{{edit}}</button>
    </nav>
</main>
<script src="home.js" defer></script>
</body>
</html>
