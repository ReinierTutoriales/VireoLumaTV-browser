<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{title}}</title>
<style>
:root { color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
       background: #000; color: #e6e6e6; font: 18px/1.5 sans-serif; }
main { box-sizing: border-box; width: 100%; max-width: 46rem; padding: 2rem; }
.warning-mark { display: flex; align-items: center; justify-content: center; width: 4rem; height: 4rem;
                border: 3px solid #ff8a80; border-radius: 1rem; color: #ff8a80;
                font-size: 2.5rem; font-weight: 700; line-height: 1; }
h1 { font-size: 1.75rem; line-height: 1.25; margin: 1rem 0 1.5rem; }
dl { margin: 0 0 2rem; }
dt { color: #b3b3b3; font-size: .9rem; }
dd { margin: 0 0 1rem; overflow-wrap: anywhere; white-space: pre-line; }
.actions { display: flex; flex-wrap: wrap; gap: 1rem; }
button { font: inherit; border: 3px solid transparent; border-radius: 999px; padding: .6rem 1.5rem; cursor: pointer; }
#back { background: #7bd88f; color: #141414; }
#proceed { background: transparent; color: #ff8a80; border-color: #5f6368; }
button:focus { outline: none; border-color: #dadada; }
</style>
</head>
<body>
<main>
<span class="warning-mark" aria-hidden="true">!</span>
<h1>{{title}}</h1>
<dl>
<dt>{{hostLabel}}</dt><dd>{{host}}</dd>
<dt>{{errorLabel}}</dt><dd>{{error}}</dd>
<dt>{{detailsLabel}}</dt><dd>{{details}}</dd>
</dl>
<div class="actions">
<button id="back" autofocus onclick="history.back()">{{back}}</button>
<button id="proceed" onclick="VireoLumaTVApp.trustCertificateOnce()">{{proceed}}</button>
</div>
</main>
</body>
</html>
