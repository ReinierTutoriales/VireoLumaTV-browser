<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{title}}</title>
<style>
:root { color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
       background: #121417; color: #e8eaed; font: 18px/1.5 sans-serif; }
main { box-sizing: border-box; width: 100%; max-width: 46rem; padding: 2rem; }
img { width: 4rem; height: 4rem; }
h1 { font-size: 1.75rem; line-height: 1.25; margin: 1rem 0 1.5rem; }
dl { margin: 0 0 2rem; }
dt { color: #9aa0a6; font-size: .9rem; }
dd { margin: 0 0 1rem; overflow-wrap: anywhere; white-space: pre-line; }
.actions { display: flex; flex-wrap: wrap; gap: 1rem; }
button { font: inherit; border: 3px solid transparent; border-radius: 999px; padding: .6rem 1.5rem; cursor: pointer; }
#back { background: #8ab4f8; color: #0b1a33; }
#proceed { background: transparent; color: #f28b82; border-color: #5f6368; }
button:focus { outline: none; border-color: #ffffff; }
</style>
</head>
<body>
<main>
<img src="pages/ic_warning.svg" alt="">
<h1>{{title}}</h1>
<dl>
<dt>{{hostLabel}}</dt><dd>{{host}}</dd>
<dt>{{errorLabel}}</dt><dd>{{error}}</dd>
<dt>{{detailsLabel}}</dt><dd>{{details}}</dd>
</dl>
<div class="actions">
<button id="back" autofocus onclick="history.back()">{{back}}</button>
<button id="proceed" onclick="VireoLumaTVApp.trustCertificateOnce()">{{proceed}}</button>
</div>
</main>
</body>
</html>
