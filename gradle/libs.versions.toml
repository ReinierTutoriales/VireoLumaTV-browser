[versions]
android-compileSdk = "37"
android-compileSdkMinor = "1"
android-minSdk = "24"
android-targetSdk = "37"
# NDK r30 LTS; links the Rust adblock engine (native/adblock-jni)
android-ndk = "30.0.16248370"
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.12"

appcompat = "1.8.0"
webkit = "1.18.0"
recyclerview = "1.4.0"
coroutines-android = "1.11.0"
lifecycle-runtime-ktx = "2.11.0"
room = "2.8.5"
profileinstaller = "1.4.1"
metrics-performance = "1.0.0"
benchmark = "1.5.0"
androidx-test-junit = "1.3.0"

junit = "4.13.2"
robolectric = "4.17"

[libraries]
# Kotlin compiler for AGP's built-in Kotlin
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

# AndroidX
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-metrics-performance = { group = "androidx.metrics", name = "metrics-performance", version.ref = "metrics-performance" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle-runtime-ktx" }

# Kotlin
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines-android" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
