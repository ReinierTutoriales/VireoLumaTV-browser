[package]
name = "vireo-adblock"
version = "1.0.0"
edition = "2021"
publish = false
description = "JNI bridge between VireoLumaTV and Brave's adblock-rust engine"
license = "MPL-2.0"

[lib]
name = "vireoadblock"
crate-type = ["cdylib"]

[dependencies]
# Without the default "single-thread" feature the Engine is Sync and can be queried from any
# WebView worker thread.
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
jni = "0.22.4"
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
